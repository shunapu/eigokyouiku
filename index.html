<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phonics Adventure</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">フォニックス英語</p>
          <h1>Phonics Adventure</h1>
        </div>
        <div class="stars" id="scoreCount" role="status" aria-live="polite">🎈 0点</div>
      </header>

      <main class="panel">
        <section class="lesson-card">
          <div class="progress-wrap">
            <span id="lessonLabel">レッスン 1 / 6</span>
            <div class="progress-bar">
              <div id="progressFill"></div>
            </div>
          </div>

          <div class="letter-box">
            <div class="letter-pair">
              <div class="letter-card uppercase">
                <span class="label">大文字</span>
                <span class="letter" id="letterBig">S</span>
              </div>
              <div class="letter-card lowercase-card">
                <span class="label">小文字</span>
                <span class="letter small" id="letterSmall">s</span>
              </div>
            </div>
            <button class="sound-btn" id="playSoundBtn">🔊 音を聞く</button>
          </div>

          <div class="word-list" id="wordList"></div>

          <div class="actions">
            <button id="prevBtn" class="secondary">前へ</button>
            <button id="nextBtn" class="primary">次へ</button>
          </div>
        </section>

        <section class="game-card">
          <h2>ふうせんゲーム</h2>
          <p class="game-instructions">上に飛んでいく風船をタップしてポイントをゲット！</p>
          <div id="balloonGame" class="balloon-game" aria-label="アルファベットの風船ゲーム">
            <button id="startGameBtn" class="game-start-btn" type="button">▶ ゲームスタート</button>
          </div>
        </section>

        <section class="alphabet-card">
          <h2>アルファベット表</h2>
          <div id="alphabetGrid" class="alphabet-grid"></div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
